name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # reads packageManager and .node-version, runs the frozen install
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write
      id-token: write
    steps:
      # the release notes need the previous tag and the commits since it
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # non zero when the registry lacks the version or the package
          if pnpm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # provenance is opt in for pnpm. git checks guard local publishes, ci is on the pushed commit
      - if: steps.version.outputs.publish == 'true'
        run: pnpm publish --provenance --no-git-checks
      - if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          # grep exits 1 when a section has no commits
          log=$(git log --no-merges --format='%s (%h)' "${prev:+$prev..}HEAD" | grep -v '^chore: bump version' || true)
          # section <title> <grep args>
          section() {
            [ -n "$log" ] || return 0
            title=$1
            shift
            lines=$(grep -E "$@" <<<"$log" | sed 's/^/- /' || true)
            if [ -n "$lines" ]; then printf '## %s\n\n%s\n\n' "$title" "$lines"; fi
          }
          {
            section features '^feat[(:!]'
            section fixes '^fix[(:!]'
            section other -v '^(feat|fix)[(:!]'
            if [ -n "$prev" ]; then echo "https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"; fi
          } > notes.md
          gh release create "$TAG" --notes-file notes.md
