name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # reads packageManager and .node-version, runs the frozen install
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # non zero when the registry lacks the version or the package
          if pnpm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # provenance is opt in for pnpm. git checks guard local publishes, ci is on the pushed commit
      - if: steps.version.outputs.publish == 'true'
        run: pnpm publish --provenance --no-git-checks
      - if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
